<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pancasila — Pendidikan Vokasi UB</title>
    <style>
        :root {
            --ub-blue: #0d2b57;
            --ub-blue-deep: #081d3b;
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; }
        body {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #132238;
            background: #f5f7fa;
            overflow-x: hidden;
        }

        .page {
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        header {
            position: absolute;
            inset: 0 0 auto 0;
            z-index: 20;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            padding: clamp(18px, 3vw, 32px) clamp(18px, 5vw, 64px);
            pointer-events: none;
        }

        header img {
            width: clamp(46px, 6vw, 72px);
            height: clamp(46px, 6vw, 72px);
            object-fit: contain;
            display: block;
        }

        .welcome {
            flex: 1;
            display: grid;
            place-items: center;
            padding: 110px 24px 80px;
            text-align: center;
            background: linear-gradient(160deg, #fbfcfe 0%, #f0f4f9 100%);
            transition: opacity 420ms ease, transform 420ms ease;
        }

        .welcome-content {
            width: min(760px, 100%);
            transition: opacity 420ms ease, transform 420ms ease;
        }

        .eyebrow {
            margin: 0 0 14px;
            font-size: 0.88rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--ub-blue);
        }

        h1 {
            margin: 0;
            font-size: clamp(2.9rem, 7vw, 5.7rem);
            line-height: 0.98;
            letter-spacing: -0.045em;
            color: var(--ub-blue-deep);
        }

        .question {
            margin: 22px 0 34px;
            font-size: clamp(1.55rem, 3.3vw, 2.35rem);
            font-weight: 500;
            color: #31435b;
        }

        .start-btn {
            border: 0;
            border-radius: 14px;
            padding: 15px 34px;
            min-width: 142px;
            font: inherit;
            font-weight: 800;
            font-size: 1rem;
            color: #fff;
            background: var(--ub-blue);
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(13, 43, 87, 0.18);
            transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease, opacity 200ms ease;
        }

        .start-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(13, 43, 87, 0.23);
            background: #12376d;
        }

        .start-btn:active:not(:disabled) { transform: translateY(0); }
        .start-btn:disabled { cursor: default; opacity: 0; }
        .start-btn:focus-visible { outline: 3px solid rgba(201, 162, 39, 0.45); outline-offset: 4px; }

        /*
         * PINTU:
         * Kedua panel awalnya menutup seluruh layar dari garis tengah.
         * Satu animation sequence mengatur:
         * 1) buka ±2,205 detik
         * 2) tahan terbuka ±0,686 detik
         * 3) tutup ±2,009 detik
         * Total visual = 4,9 detik.
         */
        .door {
            position: fixed;
            inset: 0;
            z-index: 30;
            display: grid;
            grid-template-columns: 1fr 1fr;
            pointer-events: none;
            visibility: hidden;
        }

        .door-panel {
            background: var(--ub-blue-deep);
            transform: translateX(0);
            will-change: transform;
        }

        .door-panel.left { transform-origin: right center; }
        .door-panel.right { transform-origin: left center; }

        .page.is-opening .door {
            visibility: visible;
        }

        .page.is-opening .welcome-content {
            animation: welcomeOut 420ms ease forwards;
        }

        .page.is-opening .welcome {
            animation: welcomeFade 420ms ease forwards;
        }

        .page.is-opening .door-panel.left {
            animation: doorLeft 4.9s cubic-bezier(.4, 0, .2, 1) forwards;
        }

        .page.is-opening .door-panel.right {
            animation: doorRight 4.9s cubic-bezier(.4, 0, .2, 1) forwards;
        }

        @keyframes welcomeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(12px); }
        }

        @keyframes welcomeFade {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(0.985); }
        }

        @keyframes doorLeft {
            0% { transform: translateX(0); }
            45% { transform: translateX(-102%); }
            59% { transform: translateX(-102%); }
            100% { transform: translateX(0); }
        }

        @keyframes doorRight {
            0% { transform: translateX(0); }
            45% { transform: translateX(102%); }
            59% { transform: translateX(102%); }
            100% { transform: translateX(0); }
        }

        @media (max-width: 540px) {
            header { padding: 16px; }
            header img { width: 52px; height: 52px; }
            .welcome { padding-left: 18px; padding-right: 18px; }
            .question { margin-top: 18px; margin-bottom: 28px; }
            .start-btn { width: min(100%, 230px); }
        }

    </style>
</head>
<body>
    <div class="page" id="page">
        <header aria-label="Identitas Universitas Brawijaya">
            <img src="logo_ub.png" alt="Logo Universitas Brawijaya">
            <img src="logo_vokasi.png" alt="Logo Pendidikan Vokasi Universitas Brawijaya">
        </header>

        <main class="welcome" id="welcome" aria-labelledby="welcomeTitle">
            <div class="welcome-content" id="welcomeContent">
                <p class="eyebrow">Media Pembelajaran</p>
                <h1 id="welcomeTitle">Selamat Datang</h1>
                <p class="question">Siap belajar?</p>
                <button class="start-btn" id="startButton" type="button">Mulai</button>
            </div>
        </main>

        <div class="door" aria-hidden="true">
            <div class="door-panel left"></div>
            <div class="door-panel right"></div>
        </div>

        <!-- Ganti SOUND_PATH di JavaScript dengan file audio Anda sendiri. -->
        <audio id="transitionSound" preload="auto"></audio>
    </div>

    <script>
        /* ====================== KONFIGURASI ====================== */
        const SOUND_PATH = 'sound.mp3';
        const NEXT_PAGE = 'menu.html';

        const page = document.getElementById('page');
        const startButton = document.getElementById('startButton');
        const transitionSound = document.getElementById('transitionSound');
        const rightDoorPanel = document.querySelector('.door-panel.right');

        transitionSound.src = SOUND_PATH;

        let started = false;

        startButton.addEventListener('click', () => {
            // Mencegah klik ulang selama animasi 4,9 detik.
            if (started) return;
            started = true;
            startButton.disabled = true;
            startButton.setAttribute('aria-disabled', 'true');

            // Suara dimulai setelah interaksi pengguna, sehingga tidak bergantung pada autoplay.
            transitionSound.currentTime = 0;
            transitionSound.play().catch(() => {
                // Jika file audio belum tersedia/format tidak sesuai, transisi visual tetap berjalan.
            });

            // Memicu satu rangkaian penuh: buka → jeda → tutup.
            page.classList.add('is-opening');
        });

        /*
         * Perpindahan halaman menunggu animationend dari panel kanan.
         * Event ini baru terjadi setelah seluruh sequence visual selesai,
         * termasuk fase terbuka dan penutupan.
         */
        rightDoorPanel.addEventListener('animationend', (event) => {
            if (!started || event.animationName !== 'doorRight') return;

            // Hentikan audio ketika halaman index akan ditinggalkan.
            transitionSound.pause();
            transitionSound.currentTime = 0;

            window.location.href = NEXT_PAGE;
        });
    </script>
</body>
</html>
